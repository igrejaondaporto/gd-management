# GitHub Pages config — served straight from /docs, no build step.
#
# `just-the-docs` gives a sidebar with the page order below, working search,
# and callout boxes. It is one of the themes GitHub Pages supports natively, so
# there is no Gemfile, no Action and no build to maintain.

title: Presença GD
description: Como usar a aplicação de presenças dos Grupos de Discípulos
lang: pt-PT

remote_theme: just-the-docs/just-the-docs

nav_sort: case_insensitive
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 4
  preview_words_after: 8

color_scheme: light

aux_links:
  Abrir a aplicação:
    - https://gds.igrejaonda.pt
aux_links_new_tab: true

footer_content: "Igreja Onda — Grupos de Discípulos."

back_to_top: true
back_to_top_text: "Voltar ao topo"

# No "Edit this page" link — the docs are for the team, not for contributors.
gh_edit_link: false

# O que sai do site publicado.
# `imagens/` fica de fora do exclude: são as capturas que as páginas mostram.
# `COMO-PUBLICAR.md` é nota interna de manutenção, não é para os utilizadores.
exclude:
  - "COMO-PUBLICAR.md"
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor/"
